<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Suthahar Jegatheesan">
  <!--
    Profile photo, circular-cropped, embedded as a data URI so the favicon
    stays a single self-contained file. The source is downscaled to 128px
    before encoding — the 640px original would base64 to ~105KB.
    A ring is drawn on top so the circle keeps its edge against both a light
    and a dark browser tab.
  -->
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <image href="data:image/jpeg;base64," width="64" height="64" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#1160d4" stroke-width="2"/>
</svg>
